[project]
name = "observatorio-avc"
version = "0.1.0"
description = "Pipeline local e observatório de internações por AVC com dados SIH/SUS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.5.6",
    "pandas==2.3.3",
    "pyarrow==23.0.1",
]

[project.optional-dependencies]
extract = ["pysus==2.11.7"]
dev = ["ruff==0.17.1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
